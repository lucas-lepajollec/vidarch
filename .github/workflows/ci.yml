name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Unit tests
        run: |
          npm run check:version
          npm run check:i18n
          npm test

      - name: Frontend lint
        run: npm --prefix client run lint

      - name: Build Full Project (Frontend & Backend)
        run: |
          npm run build
          npm run build:demo

      - name: Dependency audit
        run: |
          npm audit --audit-level=moderate
          npm --prefix client audit --audit-level=moderate

      - name: Validate Docker Compose
        run: docker compose config --quiet

  container:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container
        run: docker build --tag vidarch:ci .

      - name: Smoke-test container health
        run: |
          docker run --detach --name vidarch-ci vidarch:ci
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' vidarch-ci)"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 1
          done
          docker logs vidarch-ci
          exit 1
