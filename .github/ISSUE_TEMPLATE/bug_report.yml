name: 🐛 Bug Report
description: File a bug report to help us improve VidArch
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check if a similar issue already exists before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Setup
      description: Please share your OS, Node/Docker version, and browser.
      placeholder: |
        - OS: [e.g. Ubuntu 24.04, Windows 11, macOS]
        - Deployment: [e.g. Docker Compose, Bare Metal]
        - Browser: [e.g. Chrome, Firefox, Safari]
        - yt-dlp version: [e.g. 2026.03.01]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server Logs / Console Output
      description: Relevant logs or error messages from the terminal or browser console.
      render: shell
