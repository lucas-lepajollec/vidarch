# ==========================================
# VidArch — Docker Compose Configuration (Example)
# Production Deployment via GHCR Image
# ==========================================

services:
  vidarch:
    image: ${VIDARCH_IMAGE:-ghcr.io/lucas-lepajollec/vidarch:latest}
    container_name: vidarch
    restart: unless-stopped
    ports:
      - "2508:2508"
    environment:
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      # Persistent SQLite database (vidarch.db) and optional cookies.txt
      - ./data:/app/data
      # Downloaded videos, channel folders, thumbnails, and info.json
      - ./downloads:/app/downloads
    init: true
