# ==========================================
# VidArch — Docker Compose Configuration
# ==========================================

services:
  vidarch:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lucas-lepajollec/vidarch:latest
    container_name: vidarch
    restart: unless-stopped
    ports:
      - "${VIDARCH_BIND_ADDRESS:-127.0.0.1}:2499:2499"
    environment:
      - PORT=2499
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DOWNLOADS_DIR=/app/downloads
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    volumes:
      # Persistent SQLite database & cookies.txt
      - ./data:/app/data
      # Downloaded videos and channel archives
      - ./downloads:/app/downloads
