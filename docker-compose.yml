# ==========================================
# VidArch — Docker Compose Configuration
# ==========================================

services:
  vidarch:
    build:
      context: .
      dockerfile: Dockerfile
    image: vidarch:local
    container_name: vidarch
    restart: unless-stopped
    ports:
      - "${VIDARCH_BIND_ADDRESS:-127.0.0.1}:2499:2499"
    environment:
      - PORT=2499
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DOWNLOADS_DIR=/app/downloads
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    volumes:
      # Persistent SQLite database & cookies.txt
      - ./data:/app/data
      # Downloaded videos and channel archives
      - ./downloads:/app/downloads
    read_only: true
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:2499/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
