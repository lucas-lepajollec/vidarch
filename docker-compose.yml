# ==========================================
# VidArch — Docker Compose Configuration
# ==========================================

services:
  vidarch:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lucas-lepajollec/vidarch:latest
    container_name: vidarch
    restart: unless-stopped
    ports:
      - "2499:2499"
    environment:
      - PORT=2499
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DOWNLOADS_DIR=/app/downloads
      # Optional: lock the UI/API behind a password
      # - AUTH_PASSWORD=change-me
    volumes:
      # Persistent SQLite database & cookies.txt
      - ./data:/app/data
      # Downloaded videos and channel archives
      - ./downloads:/app/downloads
